<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 World Cup Pool Dashboard</title>
<style>
:root{--primary:#1a3c5e;--accent:#c8a84b;--green:#2d7a41;--red:#c0392b;--light:#f4f6f9;--card:#fff;--border:#dde1e7;--text:#1e2532;--muted:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--light);color:var(--text)}
header{background:linear-gradient(135deg,#0a2342 0%,#1a3c5e 60%,#0d5c2e 100%);color:#fff;padding:20px 24px 0;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.3)}
header h1{font-size:1.9rem;letter-spacing:.5px;margin-bottom:4px}
header p{color:rgba(255,255,255,.65);font-size:.85rem;margin-bottom:16px}
.trophy{font-size:2.2rem;margin-bottom:6px}
nav{display:flex;justify-content:center;gap:2px;flex-wrap:wrap;margin-top:8px}
nav button{background:rgba(255,255,255,.12);border:none;color:rgba(255,255,255,.8);padding:10px 18px;font-size:.88rem;cursor:pointer;border-radius:8px 8px 0 0;transition:all .2s;font-family:inherit}
nav button.active,nav button:hover{background:var(--light);color:var(--primary);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:24px 16px}
.tab-panel{display:none}
.tab-panel.active{display:block}
.card{background:var(--card);border-radius:12px;padding:20px 22px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:20px;border:1px solid var(--border)}
.card h2{font-size:1.05rem;color:var(--primary);margin-bottom:14px;padding-bottom:10px;display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--accent)}
.standings-table{width:100%;border-collapse:collapse;font-size:.9rem}
.standings-table th{background:var(--primary);color:#fff;padding:10px 12px;text-align:left}
.standings-table th:not(:first-child){text-align:center}
.standings-table td{padding:10px 12px;border-bottom:1px solid var(--border)}
.standings-table td:not(:first-child){text-align:center}
.standings-table tr:hover{background:#f8f9ff}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-weight:700;font-size:.85rem;background:var(--border);color:var(--text)}
.rank-1{background:gold;color:#333}
.rank-2{background:#c0c0c0;color:#333}
.rank-3{background:#cd7f32;color:#fff}
.score-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-weight:700;font-size:.88rem;background:var(--primary);color:#fff}
.pick-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}
.pick-card h3{font-size:1rem;color:var(--primary);margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.pick-card h3:hover{color:var(--accent)}
